version: 1.0.0-{build}

image: Visual Studio 2022

branches:
  only:
    - main

environment:
  matrix:
    - nodejs_version: 20

install:
  - ps: Install-Product node $env:nodejs_version
  - ps: |
      $python = (& py -3.11 -c "import sys; print(sys.executable)").Trim()
      $env:PYTHON = $python
      $env:npm_config_python = $python
      Write-Host "Using Python at $python"
      & $python --version
  - npm ci

build: off

build_script:
  - npx electron-builder --win --ia32 --publish never

artifacts:
  - path: dist_electron\**
    name: windows-build
