appId: com.cro.p
productName: "CRO P"
icon: release/.icon-ico/icon.ico
directories:
  output: release
asar: false
files:
  - dist/**
  - electron/**
  - server/**
  - node_modules/**
  - package.json
extraResources:
  # Ship Prisma engines and schema so the packaged app can initialize Prisma in production.
  - from: node_modules/.prisma
    to: app/node_modules/.prisma
  - prisma/schema.prisma
  - prisma/dev.db
  - electron/icons/chicken.png
extraMetadata:
  main: electron/main.cjs
npmRebuild: true
win:
  target:
    - nsis
  arch:
    - x64
    - ia32
  signAndEditExecutable: false
publish:
  provider: github
  owner: carloss23932
  repo: cashier-updata
  releaseType: release
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: "CRO P"
  runAfterFinish: true
