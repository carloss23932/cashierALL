version: 1.0.0-{build}

image: Visual Studio 2022

branches:
  only:
    - main

environment:
  matrix:
    - nodejs_version: 20

install:
  - ps: Install-Product node $env:nodejs_version
  - npm ci

build: off

build_script:
  - npx electron-builder --win --x64 --ia32

artifacts:
  - path: dist_electron\**
    name: windows-build
